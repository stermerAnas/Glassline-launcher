
name: Build Glassline APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract launcher source
        run: |
          unzip -oq "GlasslineLauncher-prototype (2).zip" -d build-source

      - name: Improve screen animations
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("build-source/GlasslineLauncher")
          matches = list(root.rglob("MainActivity.kt"))

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected one MainActivity.kt, found {len(matches)}"
              )

          path = matches[0]
          source = path.read_text(encoding="utf-8")

          # Keep app discovery and the LaunchableApp model unchanged.
          # Add only the animation imports needed by the transition.
          imports = [
              "import androidx.compose.animation.fadeIn",
              "import androidx.compose.animation.fadeOut",
              "import androidx.compose.animation.scaleIn",
              "import androidx.compose.animation.slideInVertically",
              "import androidx.compose.animation.slideOutVertically",
          ]

          anchor = "import androidx.compose.animation.AnimatedContent\n"
          if anchor not in source:
              raise SystemExit("Could not find AnimatedContent import.")

          for item in imports:
              if item not in source:
                  source = source.replace(
                      anchor, anchor + item + "\n", 1
                  )
                  anchor = item + "\n"

          old = (
              "transitionSpec = { "
              "androidx.compose.animation.fadeIn("
              "tween(160, easing = FastOutSlowInEasing)) "
              "togetherWith "
              "androidx.compose.animation.fadeOut(tween(100)) },"
          )

          new = """transitionSpec = {
              if (targetState) {
                  (
                      slideInVertically(
                          animationSpec = tween(
                              300,
                              easing = FastOutSlowInEasing
                          ),
                          initialOffsetY = { height -> height / 3 }
                      ) +
                      fadeIn(tween(220)) +
                      scaleIn(
                          initialScale = 0.97f,
                          animationSpec = tween(
                              300,
                              easing = FastOutSlowInEasing
                          )
                      )
                  ) togetherWith (
                      slideOutVertically(
                          animationSpec = tween(180),
                          targetOffsetY = { height -> -height / 12 }
                      ) + fadeOut(tween(150))
                  )
              } else {
                  (
                      slideInVertically(
                          animationSpec = tween(250),
                          initialOffsetY = { height -> -height / 12 }
                      ) + fadeIn(tween(200))
                  ) togetherWith (
                      slideOutVertically(
                          animationSpec = tween(220),
                          targetOffsetY = { height -> height / 3 }
                      ) + fadeOut(tween(170))
                  )
              }
          },"""

          count = source.count(old)
          if count != 1:
              raise SystemExit(
                  f"Expected one original transition, found {count}. "
                  "No source changes were written."
              )

          source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          print("Animation patch applied successfully.")
          PY

      - name: Build debug APK
        run: gradle -p build-source/GlasslineLauncher assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlasslineLauncher-performance-debug-apk
          path: build-source/GlasslineLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
