
name: Build Glassline Launcher

on:
  push:
    paths:
      - "GlasslineLauncher/**"
      - ".github/workflows/Build-glassline.yml"
  pull_request:
    paths:
      - "GlasslineLauncher/**"
      - ".github/workflows/Build-glassline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glassline-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify project files
        shell: bash
        run: |
          test -f GlasslineLauncher/settings.gradle.kts
          test -f GlasslineLauncher/build.gradle.kts
          test -f GlasslineLauncher/app/build.gradle.kts
          gradle --version

      - name: Run unit tests
        run: gradle -p GlasslineLauncher :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle -p GlasslineLauncher :app:assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          APK="GlasslineLauncher/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Debug APK was not produced"
            find GlasslineLauncher/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: glassline-debug-apk
          path: GlasslineLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
