
name: Build Glassline Launcher

on:
  push:
    paths:
      - "GlasslineLauncher-premium-rebuild/GlasslineLauncher/**"
      - ".github/workflows/Build-glassline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
       uses: android-actions/setup-android@v4
       with:
         log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug APK
        run: gradle -p "GlasslineLauncher-premium-rebuild/GlasslineLauncher" :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlasslineLauncher-debug-apk
          path: GlasslineLauncher-premium-rebuild/GlasslineLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
